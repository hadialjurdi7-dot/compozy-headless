worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-body/fcgi;
    uwsgi_temp_path       /tmp/nginx-body/uwsgi;
    scgi_temp_path        /tmp/nginx-body/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        client_max_body_size 128m;

        location / {
            proxy_pass http://127.0.0.1:2123;
            proxy_http_version 1.1;

            # The daemon only trusts loopback Host + same-origin requests.
            proxy_set_header Host "127.0.0.1:2123";
            proxy_set_header Origin "";
            proxy_set_header Referer "";
            proxy_set_header Sec-Fetch-Site "";
            proxy_set_header Sec-Fetch-Mode "";
            proxy_set_header Sec-Fetch-Dest "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # SSE / long-lived agent streams
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
